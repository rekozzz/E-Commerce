version: '3.8'

services:
  backend:
    # The image will be pulled from your AWS ECR repository
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/nexshop-backend:latest
    container_name: nexshop-backend
    restart: always
    ports:
      - "80:3000"
    environment:
      # These will be read from the .env file in the directory where you run docker-compose
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-nexshop}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - nexshop-network

networks:
  nexshop-network:
    driver: bridge
