version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexshop-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nexshop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexshop-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexshop-backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-nexshop}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - db
    networks:
      - nexshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://100.52.22.42/api
    container_name: nexshop-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - nexshop-network

networks:
  nexshop-network:
    driver: bridge

volumes:
  postgres_data:
